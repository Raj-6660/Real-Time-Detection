services:
  - type: web
    name: real-time-detection-app
    env: python
    buildCommand: "pip install -r website/requirements.txt"  # Ensure it points to the correct location of requirements.txt
    startCommand: "gunicorn -w 4 -b 0.0.0.0:8000 website.app:app"  # Using Gunicorn to run the app
    rootDir: website  # Set rootDir to 'website' folder where app.py is located
    plan: free
    region: singapore
